<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef Console | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Baskerville&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="saveStatus">
    <i class="fa-solid fa-circle-check" style="color:var(--green)"></i>
    <span>Changes Staged</span>
</div>

<div id="iconModal" class="modal-overlay">
    <div class="modal-content">
        <h3 style="margin-bottom:20px; font-family:'Playfair Display'; color:var(--gold);">Choose Icon</h3>
        <div class="icon-grid" id="icon-picker-list" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;"></div>
        <button class="btn btn-main" style="margin-top:20px;" onclick="closeIconPicker()">Cancel</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <div class="controls">
            <div class="control-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></div>
            <div class="control-btn" onclick="toggleTheme()"><i id="themeIcon" class="fa-solid fa-moon"></i></div>
        </div>
        <img class="logo" src="https://cdn.craftingstore.net/rPPmDHlLQ1/1aa628fef9ff6edac3320855caba2c95/aklb0wlnur0rxbtsfq8u.png">
        <div class="subtitle">Kitchen Administration Console</div>
    </div>

    <div id="admin-container"></div>

    <div style="padding-top: 20px;">
        <button class="btn" style="width:100%; border:1px solid var(--green); color:var(--green); background:transparent;" onclick="addCategory()">+ Add New Section</button>
        <button class="btn btn-main" style="margin-top:10px;" onclick="downloadJSON()">DOWNLOAD MENU.JSON</button>
    </div>
</div>

<script>
    if (sessionStorage.getItem('authenticated') !== 'true') window.location.href = 'index.html';
    
    let menuData = null;
    let activeIconCategory = null;
    const iconList = ['fa-utensils', 'fa-bread-slice', 'fa-burger', 'fa-pizza-slice', 'fa-egg', 'fa-shrimp', 'fa-fish', 'fa-ice-cream', 'fa-wine-glass', 'fa-mug-hot', 'fa-cocktail'];

    async function init() {
        const response = await fetch(`./menu.json?v=${Date.now()}`);
        menuData = await response.json();
        render();
    }

    function render() {
        const container = document.getElementById('admin-container');
        container.innerHTML = '';
        
        menuData.categories.forEach((cat, cIdx) => {
            const section = document.createElement('div');
            section.className = 'admin-section-card';
            
            section.innerHTML = `
                <div class="section-drag-handle">
                    <i class="fa-solid fa-chevron-up" onclick="moveCat(${cIdx}, -1)" style="cursor:pointer; padding:0 15px;"></i>
                    <span style="font-size:9px; opacity:0.7;">REORDER SECTION</span>
                    <i class="fa-solid fa-chevron-down" onclick="moveCat(${cIdx}, 1)" style="cursor:pointer; padding:0 15px;"></i>
                </div>
                <div style="display:flex; align-items:center; margin-bottom:15px;">
                    <i class="fa-solid ${cat.icon} admin-icon-display" style="font-size:20px; color:var(--gold); padding:10px; border:1px dashed var(--gold); margin-right:10px; cursor:pointer;" onclick="openIconPicker(${cIdx})"></i>
                    <input class="admin-input" style="font-weight:bold; flex:1;" value="${cat.title}" onchange="menuData.categories[${cIdx}].title = this.value; showStatus();">
                    <button class="btn" style="color:#c0392b;" onclick="removeCategory(${cIdx})"><i class="fa-trash"></i></button>
                </div>
                <div id="items-${cIdx}"></div>
                <button class="btn" style="font-size:11px; color:var(--green); border:1px solid var(--green); background:transparent; margin-top:10px;" onclick="addItem(${cIdx})">+ Add Item</button>
            `;

            const itemBox = section.querySelector(`#items-${cIdx}`);
            cat.items.forEach((item, iIdx) => {
                const row = document.createElement('div');
                row.className = 'admin-item-box';
                row.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <div style="display:flex; flex-direction:column; gap:5px;">
                            <i class="fa-solid fa-caret-up" onclick="moveItem(${cIdx}, ${iIdx}, -1)" style="cursor:pointer; color:var(--gold);"></i>
                            <i class="fa-solid fa-caret-down" onclick="moveItem(${cIdx}, ${iIdx}, 1)" style="cursor:pointer; color:var(--gold);"></i>
                        </div>
                        <input class="admin-input" style="flex:3" value="${item.name}" onchange="menuData.categories[${cIdx}].items[${iIdx}].name = this.value; showStatus();">
                        <input type="number" class="admin-input" style="flex:1" value="${item.price}" onchange="menuData.categories[${cIdx}].items[${iIdx}].price = parseInt(this.value); showStatus();">
                        <button class="btn" onclick="removeItem(${cIdx}, ${iIdx})" style="color:#c0392b;">×</button>
                    </div>
                    <textarea class="admin-input" style="font-size:12px; height:40px; margin-top:5px;" onchange="menuData.categories[${cIdx}].items[${iIdx}].desc = this.value; showStatus();">${item.desc}</textarea>
                `;
                itemBox.appendChild(row);
            });
            container.appendChild(section);
        });
    }

    // Fixed Reordering Logic (Works on all browsers/devices)
    function moveCat(idx, dir) {
        const newIdx = idx + dir;
        if (newIdx < 0 || newIdx >= menuData.categories.length) return;
        const temp = menuData.categories[idx];
        menuData.categories[idx] = menuData.categories[newIdx];
        menuData.categories[newIdx] = temp;
        render(); showStatus();
    }

    function moveItem(cIdx, iIdx, dir) {
        const items = menuData.categories[cIdx].items;
        const newIdx = iIdx + dir;
        if (newIdx < 0 || newIdx >= items.length) return;
        const temp = items[iIdx];
        items[iIdx] = items[newIdx];
        items[newIdx] = temp;
        render(); showStatus();
    }

    function openIconPicker(cIdx) {
        activeIconCategory = cIdx;
        const list = document.getElementById('icon-picker-list');
        list.innerHTML = '';
        iconList.forEach(icon => {
            const el = document.createElement('i');
            el.className = `fa-solid ${icon}`;
            el.style = "font-size:24px; padding:10px; cursor:pointer; text-align:center; border:1px solid #eee;";
            el.onclick = () => { menuData.categories[activeIconCategory].icon = icon; closeIconPicker(); render(); showStatus(); };
            list.appendChild(el);
        });
        document.getElementById('iconModal').style.display = 'flex';
    }

    function closeIconPicker() { document.getElementById('iconModal').style.display = 'none'; }
    function showStatus() { const s = document.getElementById('saveStatus'); s.classList.add('show'); setTimeout(() => s.classList.remove('show'), 2000); }
    function addItem(c) { menuData.categories[c].items.push({name: "New Item", price: 0, desc: ""}); render(); }
    function addCategory() { menuData.categories.push({title: "New Section", icon: "fa-utensils", items: []}); render(); }
    function removeCategory(c) { if(confirm("Delete section?")) { menuData.categories.splice(c,1); render(); } }
    function removeItem(c, i) { menuData.categories[c].items.splice(i,1); render(); }
    function downloadJSON() {
        const blob = new Blob([JSON.stringify(menuData, null, 2)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'menu.json'; a.click();
    }
    function logout() { sessionStorage.removeItem('authenticated'); window.location.href = 'index.html'; }
    function toggleTheme() { document.body.classList.toggle('dark'); }

    init();
</script>
</body>
</html>
