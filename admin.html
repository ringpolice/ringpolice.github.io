<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chef Console | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="saveStatus">
    <i id="statusIcon" class="fa-solid fa-circle-notch spinner"></i>
    <span id="statusText">Syncing...</span>
</div>

<div id="iconModal" class="modal-overlay">
    <div class="modal-content" style="width: 400px;">
        <h3 style="margin-bottom:20px; font-family:'Playfair Display'; color:var(--gold);">Select Section Icon</h3>
        <div class="icon-grid" id="icon-picker-list"></div>
        <button class="btn btn-main" style="margin-top:20px;" onclick="closeIconPicker()">Close</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <div class="controls">
            <div class="control-btn" onclick="logout()" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></div>
            <div class="control-btn" onclick="toggleTheme()" title="Toggle Theme"><i id="themeIcon" class="fa-solid fa-moon"></i></div>
        </div>
        <img class="logo" src="https://cdn.craftingstore.net/rPPmDHlLQ1/1aa628fef9ff6edac3320855caba2c95/aklb0wlnur0rxbtsfq8u.png">
        <div class="subtitle">Kitchen Administration Console</div>
    </div>

    <div id="admin-container"></div>

    <div style="flex-shrink:0; padding-top: 20px;">
        <button class="btn btn-add" style="width:100%;" onclick="addCategory()">+ Create New Menu Section</button>
        <button class="btn btn-main" style="margin-top:10px;" onclick="downloadJSON()">DOWNLOAD MENU.JSON</button>
    </div>
</div>

<script>
    if (sessionStorage.getItem('authenticated') !== 'true') window.location.href = 'index.html';
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

    let menuData = null;
    let saveTimeout;
    let draggedItemInfo = null;
    let draggedSectionIdx = null;
    let activeIconCategory = null;

    const iconList = [
        'fa-utensils', 'fa-bread-slice', 'fa-plate-wheat', 'fa-bowl-food', 'fa-burger', 
        'fa-pizza-slice', 'fa-hotdog', 'fa-egg', 'fa-cheese', 'fa-bacon', 
        'fa-shrimp', 'fa-fish', 'fa-ice-cream', 'fa-cookie', 'fa-cake-candles', 
        'fa-apple-whole', 'fa-carrot', 'fa-leaf', 'fa-wine-glass', 'fa-mug-hot', 
        'fa-glass-water', 'fa-beer-mug-empty', 'fa-cocktail', 'fa-bottle-water'
    ];

    async function init() {
        const response = await fetch(`./menu.json?v=${new Date().getTime()}`);
        menuData = await response.json();
        render();
        updateThemeIcon(document.body.classList.contains('dark'));
    }

    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateThemeIcon(isDark);
    }

    function updateThemeIcon(isDark) {
        const icon = document.getElementById('themeIcon');
        if (icon) icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    function render() {
        const container = document.getElementById('admin-container');
        container.innerHTML = '';
        menuData.categories.forEach((cat, cIdx) => {
            const section = document.createElement('div');
            section.className = 'admin-section-card';
            section.draggable = true;

            section.ondragstart = (e) => {
                if (e.target.className.includes('admin-section-card')) {
                    draggedSectionIdx = cIdx;
                    e.target.style.opacity = "0.4";
                }
            };
            section.ondragover = (e) => e.preventDefault();
            section.ondrop = (e) => {
                e.preventDefault();
                if (draggedSectionIdx !== null) handleSectionDrop(draggedSectionIdx, cIdx);
                else handleItemDrop(e, cIdx);
            };
            section.ondragend = (e) => { e.target.style.opacity = "1"; draggedSectionIdx = null; };

            section.innerHTML = `
                <div class="section-drag-handle"><i class="fa-solid fa-grip-lines"></i></div>
                <div style="display:flex; align-items:center; margin-bottom:15px; padding: 0 5px;">
                    <i class="fa-solid ${cat.icon || 'fa-utensils'} admin-icon-display" onclick="openIconPicker(${cIdx})"></i>
                    <input class="admin-input" style="font-weight:bold; font-size:18px; flex:1;" value="${cat.title}" onchange="updateCat(${cIdx}, this.value, this)">
                    <button class="btn btn-del" style="margin-left:10px;" onclick="removeCategory(${cIdx})"><i class="fa-trash fa-solid"></i></button>
                </div>
                <div id="items-${cIdx}"></div>
                <button class="btn btn-add" style="font-size:12px;" onclick="addItem(${cIdx})">+ Add Dish</button>`;
            
            const itemBox = section.querySelector(`#items-${cIdx}`);
            cat.items.forEach((item, iIdx) => {
                const row = document.createElement('div');
                row.className = 'admin-item-box draggable-item';
                row.draggable = true;
                row.ondragstart = (e) => { e.stopPropagation(); draggedItemInfo = { cIdx, iIdx }; e.target.classList.add('dragging'); };
                row.ondragend = (e) => e.target.classList.remove('dragging');

                row.innerHTML = `
                    <div style="display:flex; gap:10px; align-items:center;">
                        <i class="fa-solid fa-grip-vertical drag-handle"></i>
                        <input class="admin-input" style="flex:3" value="${item.name}" onchange="updateItem(${cIdx}, ${iIdx}, 'name', this.value, this)">
                        <div style="position:relative; flex:1; display:flex; align-items:center;">
                            <span style="position:absolute; left:5px; color:var(--gold); font-weight:bold;">$</span>
                            <input type="text" class="admin-input" style="padding-left:18px;" value="${item.price}" onchange="updateItem(${cIdx}, ${iIdx}, 'price', this.value, this)" onkeydown="validateNum(event)">
                        </div>
                        <button class="btn btn-del" onclick="removeItem(${cIdx}, ${iIdx})">×</button>
                    </div>
                    <textarea class="admin-input" style="height:40px; font-size:12px; margin-top:5px; margin-left:25px; width:calc(100% - 25px);" onchange="updateItem(${cIdx}, ${iIdx}, 'desc', this.value, this)">${item.desc}</textarea>`;
                itemBox.appendChild(row);
            });
            container.appendChild(section);
        });
    }

    function openIconPicker(cIdx) {
        activeIconCategory = cIdx;
        const pickerList = document.getElementById('icon-picker-list');
        pickerList.innerHTML = '';
        iconList.forEach(icon => {
            const el = document.createElement('i');
            el.className = `fa-solid ${icon} icon-option`;
            el.onclick = () => selectIcon(icon);
            pickerList.appendChild(el);
        });
        document.getElementById('iconModal').style.display = 'flex';
    }

    function selectIcon(iconName) {
        menuData.categories[activeIconCategory].icon = iconName;
        closeIconPicker();
        render();
        showStatus('saved');
    }

    function closeIconPicker() { document.getElementById('iconModal').style.display = 'none'; }

    function handleSectionDrop(src, dest) {
        if (src === dest) return;
        const [moved] = menuData.categories.splice(src, 1);
        menuData.categories.splice(dest, 0, moved);
        showStatus('sync'); render(); setTimeout(() => showStatus('saved'), 600);
    }

    function handleItemDrop(e, destC) {
        if (!draggedItemInfo) return;
        const { cIdx, iIdx } = draggedItemInfo;
        const [moved] = menuData.categories[cIdx].items.splice(iIdx, 1);
        menuData.categories[destC].items.push(moved);
        showStatus('sync'); render(); setTimeout(() => showStatus('saved'), 600);
        draggedItemInfo = null;
    }

    function validateNum(e) {
        if ([46, 8, 9, 27, 13].indexOf(e.keyCode) !== -1 || (e.keyCode >= 35 && e.keyCode <= 40)) return;
        if ((e.shiftKey || (e.keyCode < 48 || e.keyCode > 57)) && (e.keyCode < 96 || e.keyCode > 105)) e.preventDefault();
    }

    function updateItem(c, i, f, v, el) { 
        showStatus('sync');
        menuData.categories[c].items[i][f] = (f === 'price') ? (parseInt(v) || 0) : v;
        if(el) { el.classList.add('input-saved'); setTimeout(()=>el.classList.remove('input-saved'), 500); }
        clearTimeout(saveTimeout); saveTimeout = setTimeout(() => showStatus('saved'), 800);
    }

    function updateCat(c, v, el) { 
        menuData.categories[c].title = v; 
        if(el) { el.classList.add('input-saved'); setTimeout(()=>el.classList.remove('input-saved'), 500); }
    }

    function showStatus(type) {
        const el = document.getElementById('saveStatus');
        const icon = document.getElementById('statusIcon');
        const text = document.getElementById('statusText');
        el.classList.add('show');
        if (type === 'sync') { icon.className = "fa-solid fa-circle-notch spinner"; text.innerText = "Syncing..."; }
        else { icon.className = "fa-solid fa-circle-check"; text.innerText = "Data Updated"; setTimeout(()=>el.classList.remove('show'), 1500); }
    }

    function addItem(c) { 
        menuData.categories[c].items.push({name: "New Dish", price: 0, desc: ""}); 
        render(); 
        setTimeout(() => {
            const list = document.getElementById(`items-${c}`);
            list.lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 50);
    }

    function addCategory() { 
        menuData.categories.push({title: "New Section", icon: "fa-utensils", items: []}); 
        render(); 
        setTimeout(() => {
            const container = document.getElementById('admin-container');
            container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
        }, 50);
    }

    function removeCategory(c) { if(confirm("Delete section?")) { menuData.categories.splice(c,1); render(); } }
    function removeItem(c, i) { menuData.categories[c].items.splice(i,1); render(); }

    function downloadJSON() {
        const blob = new Blob([JSON.stringify(menuData, null, 2)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'menu.json'; a.click();
    }

    function logout() { sessionStorage.removeItem('authenticated'); window.location.href = 'index.html'; }
    init();
</script>
</body>
</html>
