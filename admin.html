<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chef Console | Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
    <div class="container">
        <div class="controls">
            <i class="fa-solid fa-moon control-btn" onclick="document.body.classList.toggle('dark')"></i>
            <i class="fa-solid fa-right-from-bracket control-btn" onclick="window.location.href='index.html'"></i>
        </div>

        <header style="text-align: center; margin-bottom: 30px;">
            <img src="logo.png" alt="Logo" style="height: 60px; margin-bottom: 10px;">
            <div style="color:var(--gold); font-family:'Montserrat'; font-size:10px; letter-spacing: 2px; font-weight:800;">KITCHEN ADMINISTRATION</div>
        </header>

        <div id="admin-container" style="overflow-y: auto; flex-grow: 1; padding-right: 10px;">
            </div>

        <div style="padding-top:20px; display:flex; gap:15px; border-top: 1px solid var(--border);">
            <button class="btn" style="flex:1" onclick="addCategory()">+ NEW SECTION</button>
            <button id="saveBtn" class="btn" style="flex:2" onclick="downloadJSON()">SAVE & DOWNLOAD MENU.JSON</button>
        </div>
    </div>

    <script>
        let menuData = null;

        async function init() {
            const res = await fetch('menu.json');
            menuData = await res.json();
            render();
        }

        function render() {
            const container = document.getElementById('admin-container');
            container.innerHTML = '';
            menuData.categories.forEach((cat, cIdx) => {
                const sec = document.createElement('div');
                sec.className = 'admin-section';
                sec.style.marginBottom = "30px";
                sec.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                        <input class="admin-input" style="font-family:var(--font-heading); font-weight:700; color:var(--gold); border:none; background:transparent; font-size:1.1rem; outline:none;" value="${cat.title}">
                        <i class="fa-solid fa-trash" style="color:#ef4444; cursor:pointer;" onclick="this.parentElement.parentElement.remove()"></i>
                    </div>
                    <div class="items-list">
                        ${cat.items.map(item => `
                            <div style="display:flex; align-items:center; gap:15px; margin-bottom:10px; background:var(--btn-bg); padding:12px; border-radius:8px;">
                                <div style="flex-grow:1;">
                                    <input class="admin-input" style="font-weight:600; width:100%; border:none; background:transparent; color:inherit; outline:none;" value="${item.name}">
                                    <input class="admin-input" style="font-size:0.85rem; opacity:0.6; width:100%; border:none; background:transparent; color:inherit; outline:none;" value="${item.desc}">
                                </div>
                                <div class="price-editor">
                                    <span style="color:var(--gold); margin-right:5px; font-weight:bold;">$</span>
                                    <input type="number" class="price-input" value="${item.price}">
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(sec);
            });
        }

        function downloadJSON() {
            // Re-sync logic would go here
            const blob = new Blob([JSON.stringify(menuData, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'menu.json';
            a.click();
        }

        window.onload = init;
    </script>
</body>
</html>
