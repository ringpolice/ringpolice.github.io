<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chef Console | Kitchen Administration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body class="dark">
<div class="container">
    <div class="header">
        <div class="controls">
            <i class="fa-solid fa-moon control-btn" onclick="toggleTheme()"></i>
            <i class="fa-solid fa-right-from-bracket control-btn" onclick="logout()"></i>
        </div>
        <a href="index.html" class="logo-link">
            <img class="logo" src="logo.png" alt="VindexCraft Logo">
        </a>
        <div style="color:var(--gold); font-size:12px; text-transform:uppercase; letter-spacing: 2px;">Kitchen Administration Console</div>
    </div>
    
    <div id="admin-container" style="overflow-y:auto; flex-grow:1; padding-right: 10px;">
        <div style="text-align:center; color:var(--gold); margin-top:50px;"><i class="fa-solid fa-spinner fa-spin"></i> Initializing Console...</div>
    </div>
    
    <div style="padding-top:20px; display:flex; gap:15px; border-top: 1px solid rgba(202, 167, 76, 0.2);">
        <button class="btn btn-outline" style="flex:1;" onclick="addCategory()">+ NEW SECTION</button>
        <button id="saveBtn" class="btn" style="flex:2;" onclick="downloadJSON()">SAVE & DOWNLOAD MENU.JSON</button>
    </div>
</div>

<script>
    if (sessionStorage.getItem('authenticated') !== 'true') window.location.href = 'index.html';
    let menuData = null;

    async function init() {
        try {
            const res = await fetch('./menu.json?v=' + Date.now());
            menuData = await res.json();
            render();
        } catch (e) { console.error("Load failed", e); }
    }

    function render() {
        const container = document.getElementById('admin-container');
        container.innerHTML = '';
        menuData.categories.forEach(cat => {
            const section = document.createElement('div');
            section.className = 'admin-section';
            section.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom: 1px solid rgba(202,167,76,0.1); padding-bottom: 10px;">
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
                        <i class="fa-solid fa-grip section-handle" style="cursor:grab; color:var(--gold); opacity:0.4;"></i>
                        <input class="admin-input" style="font-size:20px; font-weight:bold; font-family:'Playfair Display';" value="${cat.title}" onchange="markUnsaved()">
                    </div>
                    <i class="fa-solid fa-trash-can" style="color:#ff4d4d; cursor:pointer;" onclick="this.closest('.admin-section').remove(); markUnsaved();"></i>
                </div>
                <div class="items-list" style="min-height:30px;">
                    ${cat.items.map(item => createItemHTML(item)).join('')}
                </div>
                <button class="btn btn-outline" style="font-size:11px; color:var(--green); border-color:var(--green); margin-top:10px; border-style:dashed;" onclick="addItem(this)">+ ADD NEW DISH</button>
            `;
            container.appendChild(section);
            new Sortable(section.querySelector('.items-list'), { group: 'shared', handle: '.grip-handle', animation: 150, onEnd: () => markUnsaved() });
        });
        new Sortable(container, { handle: '.section-handle', animation: 200, onEnd: () => markUnsaved() });
    }

    function createItemHTML(item) {
        return `<div class="admin-item-box">
                <div class="item-row">
                    <i class="fa-solid fa-grip-vertical grip-handle"></i>
                    <div class="inputs-container">
                        <input class="admin-input" style="font-weight:bold;" value="${item.name || 'New Dish'}" onchange="markUnsaved()">
                        <input class="admin-input" style="font-size:12px; opacity:0.7;" value="${item.desc || 'Description'}" onchange="markUnsaved()">
                    </div>
                    <div class="price-editor">
                        <span style="color:var(--gold); font-size:12px; margin-right:5px; font-weight:bold;">$</span>
                        <input type="number" class="price-input" value="${item.price || 0}" onchange="markUnsaved()">
                    </div>
                    <i class="fa-solid fa-xmark" style="color:#ff4d4d; cursor:pointer; width:20px; text-align:right;" onclick="this.closest('.admin-item-box').remove(); markUnsaved();"></i>
                </div>
            </div>`;
    }

    function markUnsaved() { document.getElementById('saveBtn').classList.add('unsaved'); }
    function clearUnsaved() { document.getElementById('saveBtn').classList.remove('unsaved'); }

    function addItem(btn) { 
        const list = btn.previousElementSibling;
        const temp = document.createElement('div');
        temp.innerHTML = createItemHTML({});
        list.appendChild(temp.firstElementChild);
        markUnsaved();
    }

    function addCategory() { 
        const container = document.getElementById('admin-container');
        const section = document.createElement('div');
        section.className = 'admin-section';
        section.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom: 1px solid rgba(202,167,76,0.1); padding-bottom: 10px;">
                <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
                    <i class="fa-solid fa-grip section-handle" style="cursor:grab; color:var(--gold); opacity:0.4;"></i>
                    <input class="admin-input" style="font-size:20px; font-weight:bold;" value="New Section" onchange="markUnsaved()">
                </div>
                <i class="fa-solid fa-trash-can" style="color:#ff4d4d; cursor:pointer;" onclick="this.closest('.admin-section').remove(); markUnsaved();"></i>
            </div>
            <div class="items-list" style="min-height:30px;"></div>
            <button class="btn btn-outline" style="font-size:11px; color:var(--green); border-color:var(--green); margin-top:10px; border-style:dashed;" onclick="addItem(this)">+ ADD NEW DISH</button>`;
        container.appendChild(section);
        new Sortable(section.querySelector('.items-list'), { group: 'shared', handle: '.grip-handle', animation: 150, onEnd: () => markUnsaved() });
        markUnsaved();
    }

    function syncData() {
        const categories = [];
        document.querySelectorAll('.admin-section').forEach(sec => {
            const items = [];
            sec.querySelectorAll('.admin-item-box').forEach(itemBox => {
                const inputs = itemBox.querySelectorAll('.admin-input');
                items.push({ name: inputs[0].value, desc: inputs[1].value, price: parseInt(itemBox.querySelector('.price-input').value) || 0, icon: "fa-utensils" });
            });
            categories.push({ title: sec.querySelector('.admin-input').value, icon: "fa-utensils", items: items });
        });
        menuData.categories = categories;
    }

    function downloadJSON() {
        syncData();
        const blob = new Blob([JSON.stringify(menuData, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'menu.json';
        a.click();
        clearUnsaved();
    }

    function toggleTheme() { document.body.classList.toggle('dark'); }
    function logout() { sessionStorage.removeItem('authenticated'); window.location.href = 'index.html'; }
    window.onload = init;
</script>
</body>
</html>
