<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chef Console | Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
    <div class="container">
        <div class="controls">
            <i class="fa-solid fa-moon control-btn" onclick="document.body.classList.toggle('dark')"></i>
            <i class="fa-solid fa-right-from-bracket control-btn" onclick="window.location.href='index.html'"></i>
        </div>

        <header style="text-align: center; margin-bottom: 30px;">
            <img src="logo.png" alt="Logo" style="height: 65px; margin-bottom: 10px;">
            <div style="color:var(--gold); font-family:'Montserrat'; font-size:11px; letter-spacing: 3px; font-weight:800; text-transform:uppercase;">Administration Panel</div>
        </header>

        <div id="admin-container" style="overflow-y: auto; flex-grow: 1; padding-right: 15px;"></div>

        <div style="padding-top:20px; display:flex; gap:15px; border-top: 1px solid var(--border);">
            <button class="btn" style="flex:1" onclick="addCategory()">+ NEW SECTION</button>
            <button id="saveBtn" class="btn" style="flex:2" onclick="downloadJSON()">SAVE & DOWNLOAD MENU.JSON</button>
        </div>
    </div>

    <script>
        let menuData = null;

        async function init() {
            try {
                const res = await fetch('menu.json?v=' + Date.now());
                menuData = await res.json();
                render();
            } catch (e) { menuData = { categories: [] }; render(); }
        }

        function render() {
            const container = document.getElementById('admin-container');
            container.innerHTML = '';
            menuData.categories.forEach(cat => {
                container.appendChild(createSectionElement(cat.title, cat.items));
            });
        }

        function createSectionElement(title = "NEW SECTION", items = []) {
            const sec = document.createElement('div');
            sec.className = 'admin-section';
            sec.style.marginBottom = "30px";
            sec.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
                    <input class="admin-input cat-title" style="font-family:var(--font-heading); font-weight:700; color:var(--gold); font-size:1.1rem;" value="${title}">
                    <i class="fa-solid fa-trash" style="color:#ef4444; cursor:pointer;" onclick="this.closest('.admin-section').remove()"></i>
                </div>
                <div class="items-list">${items.map(item => createItemHTML(item)).join('')}</div>
                <button class="btn" style="font-size:0.7rem; padding:8px 12px; margin-top:10px; border-style:dashed;" onclick="addItem(this)">+ ADD DISH</button>`;
            return sec;
        }

        function createItemHTML(item = { name: "Dish Name", desc: "Description", price: 0 }) {
            return `
                <div class="admin-item-box" style="display:flex; align-items:center; gap:15px; margin-bottom:10px; background:var(--btn-bg); padding:10px; border-radius:8px;">
                    <div style="flex-grow:1;">
                        <input class="admin-input item-name" style="font-weight:600;" value="${item.name}">
                        <input class="admin-input item-desc" style="font-size:0.8rem; opacity:0.6;" value="${item.desc}">
                    </div>
                    <div class="price-editor">
                        <span style="color:var(--gold); font-weight:bold; margin-right:4px;">$</span>
                        <input type="number" class="price-input" value="${item.price}">
                    </div>
                    <i class="fa-solid fa-xmark" style="color:#ef4444; cursor:pointer;" onclick="this.parentElement.remove()"></i>
                </div>`;
        }

        function addCategory() {
            document.getElementById('admin-container').appendChild(createSectionElement());
        }

        function addItem(btn) {
            const list = btn.parentElement.querySelector('.items-list');
            const temp = document.createElement('div');
            temp.innerHTML = createItemHTML();
            list.appendChild(temp.firstElementChild);
        }

        function syncData() {
            const categories = [];
            document.querySelectorAll('.admin-section').forEach(sec => {
                const items = [];
                sec.querySelectorAll('.admin-item-box').forEach(box => {
                    items.push({
                        name: box.querySelector('.item-name').value,
                        desc: box.querySelector('.item-desc').value,
                        price: parseInt(box.querySelector('.price-input').value) || 0
                    });
                });
                categories.push({ title: sec.querySelector('.cat-title').value, items });
            });
            menuData.categories = categories;
        }

        function downloadJSON() {
            syncData();
            const blob = new Blob([JSON.stringify(menuData, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'menu.json';
            a.click();
        }

        window.onload = init;
    </script>
</body>
</html>
