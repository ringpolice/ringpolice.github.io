<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chef Console | Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="saveStatus">
    <i id="statusIcon" class="fa-solid fa-circle-notch spinner"></i>
    <span id="statusText">Syncing...</span>
</div>

<div class="container">
    <div class="header">
        <div class="controls">
            <div class="control-btn" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</div>
            <div class="control-btn" onclick="toggleTheme()"><i id="themeIcon" class="fa-solid fa-moon"></i></div>
        </div>
        <img class="logo" src="https://cdn.craftingstore.net/rPPmDHlLQ1/1aa628fef9ff6edac3320855caba2c95/aklb0wlnur0rxbtsfq8u.png">
        <div class="subtitle">Kitchen Administration Console</div>
    </div>

    <div id="admin-container"></div>

    <div style="flex-shrink:0; padding-top: 10px;">
        <button class="btn btn-add" style="width:100%;" onclick="addCategory()">+ New Category</button>
        <button class="btn btn-main" style="margin-top:10px;" onclick="downloadJSON()">SAVE & DOWNLOAD MENU.JSON</button>
    </div>
</div>

<script>
    if (sessionStorage.getItem('authenticated') !== 'true') window.location.href = 'index.html';
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

    let menuData = null;
    let saveTimeout;
    let draggedItemInfo = null;

    async function init() {
        const response = await fetch('./menu.json');
        menuData = await response.json();
        render();
        updateThemeIcon(document.body.classList.contains('dark'));
    }

    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateThemeIcon(isDark);
    }

    function updateThemeIcon(isDark) {
        const icon = document.getElementById('themeIcon');
        if (icon) icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    }

    function render() {
        const container = document.getElementById('admin-container');
        container.innerHTML = '';
        menuData.categories.forEach((cat, cIdx) => {
            const section = document.createElement('div');
            section.className = 'admin-section-card';
            section.ondragover = (e) => e.preventDefault();
            section.ondrop = (e) => handleDrop(e, cIdx);
            
            section.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <input class="admin-input" style="font-weight:bold; font-size:18px; flex:1;" value="${cat.title}" onchange="updateCat(${cIdx}, this.value, this)">
                    <button class="btn btn-del" onclick="removeCategory(${cIdx})"><i class="fa-trash fa-solid"></i></button>
                </div>
                <div id="items-${cIdx}"></div>
                <button class="btn btn-add" style="font-size:12px;" onclick="addItem(${cIdx})">+ Add Dish</button>`;
            
            const itemBox = section.querySelector(`#items-${cIdx}`);
            cat.items.forEach((item, iIdx) => {
                const row = document.createElement('div');
                row.className = 'admin-item-box draggable-item';
                row.draggable = true;
                row.ondragstart = (e) => handleDragStart(e, cIdx, iIdx);
                row.ondragend = (e) => e.target.classList.remove('dragging');

                row.innerHTML = `
                    <div style="display:flex; gap:10px; align-items:center;">
                        <i class="fa-solid fa-grip-vertical drag-handle"></i>
                        <input class="admin-input" style="flex:3" placeholder="Dish Name" value="${item.name}" onchange="updateItem(${cIdx}, ${iIdx}, 'name', this.value, this)">
                        <div style="position:relative; flex:1; display:flex; align-items:center;">
                            <span style="position:absolute; left:8px; color:var(--gold); font-weight:bold;">$</span>
                            <input type="text" class="admin-input" style="padding-left:22px;" value="${item.price}" 
                                   onchange="updateItem(${cIdx}, ${iIdx}, 'price', this.value, this)"
                                   onkeydown="validateNumber(event)">
                        </div>
                        <button class="btn btn-del" onclick="removeItem(${cIdx}, ${iIdx})">×</button>
                    </div>
                    <textarea class="admin-input" style="height:45px; font-size:12px; margin-top:5px; margin-left:25px; width:calc(100% - 25px);" onchange="updateItem(${cIdx}, ${iIdx}, 'desc', this.value, this)">${item.desc}</textarea>`;
                itemBox.appendChild(row);
            });
            container.appendChild(section);
        });
    }

    function validateNumber(e) {
        if ([46, 8, 9, 27, 13].indexOf(e.keyCode) !== -1 || (e.keyCode >= 35 && e.keyCode <= 40)) return;
        if ((e.shiftKey || (e.keyCode < 48 || e.keyCode > 57)) && (e.keyCode < 96 || e.keyCode > 105)) e.preventDefault();
    }

    function handleDragStart(e, cIdx, iIdx) {
        draggedItemInfo = { cIdx, iIdx };
        e.target.classList.add('dragging');
    }

    function handleDrop(e, destCIdx) {
        e.preventDefault();
        if (!draggedItemInfo) return;
        const { cIdx: srcCIdx, iIdx: srcIIdx } = draggedItemInfo;
        const [movedItem] = menuData.categories[srcCIdx].items.splice(srcIIdx, 1);
        menuData.categories[destCIdx].items.push(movedItem);
        showStatus('sync');
        render();
        setTimeout(() => showStatus('saved'), 600);
        draggedItemInfo = null;
    }

    function updateItem(c, i, f, v, el) { 
        showStatus('sync');
        menuData.categories[c].items[i][f] = (f === 'price') ? (parseInt(v) || 0) : v;
        flashEffect(el);
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => showStatus('saved'), 800);
    }

    function updateCat(c, v, el) { menuData.categories[c].title = v; flashEffect(el); }
    function flashEffect(el) { if(el){ el.classList.add('input-saved'); setTimeout(()=>el.classList.remove('input-saved'), 500); } }

    function showStatus(type) {
        const el = document.getElementById('saveStatus');
        const icon = document.getElementById('statusIcon');
        const text = document.getElementById('statusText');
        el.classList.add('show');
        if (type === 'sync') {
            icon.className = "fa-solid fa-circle-notch spinner"; icon.style.color = "var(--gold)"; text.innerText = "Syncing...";
        } else {
            icon.className = "fa-solid fa-circle-check"; icon.style.color = "var(--green)"; text.innerText = "Data Updated";
            setTimeout(() => el.classList.remove('show'), 1500);
        }
    }

    function addItem(c) { menuData.categories[c].items.push({name: "New Item", price: 0, desc: ""}); render(); }
    function removeItem(c, i) { if(confirm("Delete item?")) { menuData.categories[c].items.splice(i,1); render(); } }
    function addCategory() { menuData.categories.push({title: "New Category", items: []}); render(); }
    function removeCategory(c) { if(confirm("Delete category?")) { menuData.categories.splice(c,1); render(); } }

    function downloadJSON() {
        const blob = new Blob([JSON.stringify(menuData, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'menu.json';
        a.click();
    }
    function logout() { sessionStorage.removeItem('authenticated'); window.location.href = 'index.html'; }
    init();
</script>
</body>
</html>
