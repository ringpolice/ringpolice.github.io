<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chef Admin | State Dining</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="header">
        <div class="controls"><a href="index.html" class="control-btn"><i class="fa-solid fa-arrow-left"></i> Exit</a></div>
        <h1>Kitchen Admin</h1>
        <p>Modify Menu Sections & Pricing</p>
    </div>

    <div id="admin-editor"></div>

    <button class="btn-save" onclick="exportJSON()">SAVE & DOWNLOAD MENU.JSON</button>
</div>

<script>
    let menuData = null;

    async function init() {
        const response = await fetch('./menu.json');
        menuData = await response.json();
        const container = document.getElementById('admin-editor');

        menuData.categories.forEach((cat, cIdx) => {
            const div = document.createElement('div');
            div.className = 'admin-card';
            div.innerHTML = `<h3>Section: ${cat.title}</h3>`;
            
            cat.items.forEach((item, iIdx) => {
                div.innerHTML += `
                    <div style="margin-top:20px; border-top:1px solid #ddd; padding-top:10px;">
                        <input class="admin-input" value="${item.name}" onchange="update(${cIdx}, ${iIdx}, 'name', this.value)" placeholder="Name">
                        <input class="admin-input" value="${item.price}" onchange="update(${cIdx}, ${iIdx}, 'price', this.value)" placeholder="Price">
                        <textarea class="admin-input" onchange="update(${cIdx}, ${iIdx}, 'desc', this.value)" placeholder="Description">${item.desc}</textarea>
                    </div>
                `;
            });
            container.appendChild(div);
        });
    }

    function update(c, i, f, v) { menuData.categories[c].items[i][f] = v; }

    function exportJSON() {
        const data = JSON.stringify(menuData, null, 2);
        const blob = new Blob([data], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'menu.json';
        a.click();
        alert("Downloaded! Upload this to your GitHub repo to go live.");
    }
    init();
</script>
</body>
</html>
