<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chef Console | State Dining</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <div class="controls">
            <a href="index.html" class="control-btn" title="Back to Menu">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </div>
        <img class="logo" src="https://cdn.craftingstore.net/rPPmDHlLQ1/1aa628fef9ff6edac3320855caba2c95/aklb0wlnur0rxbtsfq8u.png" alt="Logo">
        <div class="subtitle">Chef's Kitchen Console</div>
    </div>

    <div class="admin-list" id="admin-container"></div>

    <div style="text-align: center;">
        <button class="btn-save" onclick="downloadJSON()">
            <i class="fa-solid fa-file-export"></i> Save & Export menu.json
        </button>
    </div>

    <div class="footer">ADMINISTRATIVE ACCESS • VINDEXCRAFT</div>
</div>

<script>
    let menuData = null;

    async function initAdmin() {
        const response = await fetch('menu.json');
        menuData = await response.json();
        const container = document.getElementById('admin-container');

        menuData.categories.forEach((cat, catIdx) => {
            const section = document.createElement('div');
            section.className = 'category-section';
            let html = `<div class="category-title">${cat.title}</div>`;

            cat.items.forEach((item, itemIdx) => {
                html += `
                <div class="menu-item">
                    <div class="admin-item-row">
                        <input class="admin-input" value="${item.name}" onchange="updateItem(${catIdx}, ${itemIdx}, 'name', this.value)" placeholder="Item Name">
                        <input class="admin-input" value="${item.price}" onchange="updateItem(${catIdx}, ${itemIdx}, 'price', this.value)" placeholder="Price">
                    </div>
                    <input class="admin-input admin-desc-input" value="${item.desc || ''}" onchange="updateItem(${catIdx}, ${itemIdx}, 'desc', this.value)" placeholder="Description (optional)">
                </div>`;
            });
            section.innerHTML = html;
            container.appendChild(section);
        });
    }

    function updateItem(cIdx, iIdx, field, val) { menuData.categories[cIdx].items[iIdx][field] = val; }

    function downloadJSON() {
        const blob = new Blob([JSON.stringify(menuData, null, 2)], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = "menu.json"; a.click();
        alert("Success! Replace your current menu.json with this new file.");
    }

    initAdmin();
</script>
</body>
</html>
