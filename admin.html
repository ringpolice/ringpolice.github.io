<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chef Console | Kitchen Administration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body class="dark">
<div class="container">
    <div class="header">
        <div style="position:absolute; right:20px; top:20px; display: flex; gap: 20px;">
            <i class="fa-solid fa-moon" onclick="toggleTheme()" style="cursor:pointer; color:var(--gold); font-size: 20px;"></i>
            <i class="fa-solid fa-right-from-bracket" onclick="logout()" style="cursor:pointer; color:var(--gold); font-size: 20px;"></i>
        </div>
        <img class="logo" src="https://cdn.craftingstore.net/rPPmDHlLQ1/1aa628fef9ff6edac3320855caba2c95/aklb0wlnur0rxbtsfq8u.png">
        <div style="color:var(--gold); font-size:12px; text-transform:uppercase; letter-spacing: 2px;">Kitchen Administration Console</div>
    </div>
    
    <div id="admin-container" style="overflow-y:auto; flex-grow:1; padding-right: 10px;">
        <div style="text-align:center; color:var(--gold); margin-top:50px;"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
    </div>
    
    <div style="padding-top:20px; display:flex; gap:15px; border-top: 1px solid rgba(202, 167, 76, 0.2);">
        <button class="btn" style="flex:1; border-color:var(--gold); color:var(--gold); background:transparent;" onclick="addCategory()">+ NEW SECTION</button>
        <button class="btn btn-main" style="flex:2;" onclick="downloadJSON()">SAVE & DOWNLOAD MENU.JSON</button>
    </div>
</div>

<script>
    if (sessionStorage.getItem('authenticated') !== 'true') window.location.href = 'index.html';
    
    let menuData = null;

    async function init() {
        const res = await fetch('./menu.json?v=' + Date.now());
        menuData = await res.json();
        render();
    }

    function render() {
        const container = document.getElementById('admin-container');
        container.innerHTML = '';

        menuData.categories.forEach((cat, cIdx) => {
            const section = document.createElement('div');
            section.className = 'admin-section';
            section.style = "margin-bottom:30px; border:1px solid var(--gold); padding:25px; border-radius:8px; background: rgba(202,167,76,0.02);";
            
            section.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom: 1px solid rgba(202,167,76,0.1); padding-bottom: 10px;">
                    <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
                        <i class="fa-solid fa-grip section-handle" style="cursor:grab; color:var(--gold); opacity:0.4;"></i>
                        <input class="admin-input" style="font-size:20px; font-weight:bold; font-family:'Playfair Display';" value="${cat.title}" onchange="menuData.categories[${cIdx}].title = this.value">
                    </div>
                    <i class="fa-solid fa-trash-can" style="color:#ff4d4d; cursor:pointer;" onclick="removeCategory(${cIdx})"></i>
                </div>
                <div class="items-list" id="items-${cIdx}" data-cat-id="${cIdx}">
                    ${cat.items.map((item, iIdx) => `
                        <div class="admin-item-box" data-item-json='${JSON.stringify(item).replace(/'/g, "&apos;")}'>
                            <div class="item-row">
                                <i class="fa-solid fa-grip-vertical grip-handle"></i>
                                <div class="inputs-container">
                                    <input class="admin-input" style="font-weight:bold;" value="${item.name}" onchange="updateItemData(${cIdx}, ${iIdx})">
                                    <input class="admin-input" style="font-size:12px; opacity:0.7;" value="${item.desc}" onchange="updateItemData(${cIdx}, ${iIdx})">
                                </div>
                                <div class="price-editor">
                                    <span style="color:var(--gold); font-size:12px; margin-right:5px; font-weight:bold;">$</span>
                                    <input type="number" class="price-input" value="${item.price}" onchange="updateItemData(${cIdx}, ${iIdx})">
                                </div>
                                <i class="fa-solid fa-xmark" style="color:#ff4d4d; cursor:pointer; width:20px; text-align:right;" onclick="removeItem(${cIdx}, ${iIdx})"></i>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <button class="btn" style="font-size:11px; color:var(--green); border-color:var(--green); background:transparent; margin-top:10px; border-style:dashed;" onclick="addItem(${cIdx})">+ ADD NEW DISH</button>
            `;
            container.appendChild(section);

            // Reorder items + MOVE BETWEEN SECTIONS
            new Sortable(section.querySelector('.items-list'), {
                group: 'shared', // This allows dragging between sections
                handle: '.grip-handle',
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: () => syncData() // Sync data structure after any move
            });
        });

        // Reorder sections
        new Sortable(container, {
            handle: '.section-handle',
            animation: 200,
            ghostClass: 'sortable-ghost',
            onEnd: () => syncData()
        });
    }

    // New function to scrape the current DOM state back into menuData
    function syncData() {
        const categories = [];
        document.querySelectorAll('.admin-section').forEach(sec => {
            const title = sec.querySelector('.admin-input').value;
            const items = [];
            sec.querySelectorAll('.admin-item-box').forEach(itemBox => {
                const inputs = itemBox.querySelectorAll('.admin-input');
                items.push({
                    name: inputs[0].value,
                    desc: inputs[1].value,
                    price: parseInt(itemBox.querySelector('.price-input').value) || 0,
                    icon: "fa-utensils"
                });
            });
            categories.push({ title, icon: "fa-utensils", items });
        });
        menuData.categories = categories;
    }

    function updateItemData() { syncData(); }
    function addItem(c) { menuData.categories[c].items.push({name: "New Dish", price: 0, desc: "Description..."}); render(); }
    function addCategory() { menuData.categories.push({title: "New Section", icon: "fa-utensils", items: []}); render(); }
    function removeCategory(c) { if(confirm("Delete section?")) { menuData.categories.splice(c,1); render(); } }
    function removeItem(c, i) { menuData.categories[c].items.splice(i,1); render(); }
    function toggleTheme() { document.body.classList.toggle('dark'); }
    function logout() { sessionStorage.removeItem('authenticated'); window.location.href = 'index.html'; }
    
    function downloadJSON() {
        syncData();
        const blob = new Blob([JSON.stringify(menuData, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'menu.json';
        a.click();
    }
    
    window.onload = init;
</script>
</body>
</html>
