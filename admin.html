<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Chef Console</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
<div class="container">
    <div class="header">
        <div style="position:absolute; right:20px; top:20px;"><i class="fa-solid fa-house" onclick="window.location.href='index.html'" style="cursor:pointer; color:var(--gold);"></i></div>
        <img class="logo" src="https://cdn.craftingstore.net/rPPmDHlLQ1/1aa628fef9ff6edac3320855caba2c95/aklb0wlnur0rxbtsfq8u.png">
        <div style="color:var(--gold); font-size:12px; text-transform:uppercase;">Kitchen Administration</div>
    </div>
    <div id="admin-container" style="overflow-y:auto; flex-grow:1;"></div>
    <div style="padding-top:20px;">
        <button class="btn btn-main" onclick="downloadJSON()">SAVE & DOWNLOAD MENU.JSON</button>
    </div>
</div>

<script>
    if (sessionStorage.getItem('authenticated') !== 'true') window.location.href = 'index.html';
    let menuData = null;

    async function init() {
        const res = await fetch('./menu.json');
        menuData = await res.json();
        render();
    }

    function render() {
        const container = document.getElementById('admin-container');
        container.innerHTML = menuData.categories.map((cat, cIdx) => `
            <div style="margin-bottom:30px; border:1px solid var(--gold); padding:20px; border-radius:8px;">
                <input class="admin-input" style="font-size:20px; font-weight:bold; margin-bottom:15px;" value="${cat.title}" onchange="menuData.categories[${cIdx}].title = this.value">
                <div id="items-${cIdx}">${cat.items.map((item, iIdx) => `
                    <div class="admin-item-box">
                        <div class="item-row">
                            <i class="fa-solid fa-grip-vertical grip-handle"></i>
                            <div class="inputs-container">
                                <input class="admin-input" style="font-weight:bold;" value="${item.name}" onchange="menuData.categories[${cIdx}].items[${iIdx}].name = this.value">
                                <input class="admin-input" style="font-size:12px; opacity:0.7;" value="${item.desc}" onchange="menuData.categories[${cIdx}].items[${iIdx}].desc = this.value">
                            </div>
                            <div class="price-container">
                                <span style="color:var(--gold); margin-right:5px;">$</span>
                                <input type="number" class="admin-input" value="${item.price}" onchange="menuData.categories[${cIdx}].items[${iIdx}].price = parseInt(this.value)">
                            </div>
                            <div class="delete-container">
                                <i class="fa-solid fa-times" style="color:#ff4d4d; cursor:pointer;" onclick="removeItem(${cIdx}, ${iIdx})"></i>
                            </div>
                        </div>
                    </div>`).join('')}</div>
                <button class="btn" style="font-size:12px; color:var(--green); border-color:var(--green); background:transparent;" onclick="addItem(${cIdx})">+ Add Dish</button>
            </div>`).join('');
    }

    function addItem(c) { menuData.categories[c].items.push({name: "New Dish", price: 0, desc: "Description here"}); render(); }
    function removeItem(c, i) { menuData.categories[c].items.splice(i,1); render(); }
    function downloadJSON() {
        const blob = new Blob([JSON.stringify(menuData, null, 2)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'menu.json'; a.click();
    }
    init();
</script>
</body>
</html>
