<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VindexCraft | Gourmet Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
    <div class="container">
        <div class="controls">
            <i class="fa-solid fa-moon control-btn" title="Toggle Theme" onclick="document.body.classList.toggle('dark')"></i>
            <i class="fa-solid fa-user-shield control-btn" title="Admin Login" onclick="window.location.href='admin.html'"></i>
        </div>

        <header style="text-align: center; margin-bottom: 40px;">
            <img src="logo.png" alt="VindexCraft" style="height: 80px; margin-bottom: 10px;">
            <div style="color:var(--gold); font-family:'Montserrat'; font-size:10px; letter-spacing: 4px; font-weight:800; text-transform:uppercase;">Established 2024</div>
        </header>

        <div id="public-menu" class="menu-grid">
            </div>
    </div>

    <script>
        async function loadMenu() {
            try {
                const res = await fetch('menu.json?v=' + Date.now());
                const data = await res.json();
                const container = document.getElementById('public-menu');
                
                data.categories.forEach(cat => {
                    const catDiv = document.createElement('div');
                    catDiv.className = 'menu-category';
                    
                    let itemsHtml = '';
                    cat.items.forEach(item => {
                        itemsHtml += `
                            <div class="menu-item" style="margin-bottom:25px;">
                                <div class="item-main">
                                    <span style="font-family:'Montserrat'; font-weight:700; letter-spacing:0.5px;">${item.name}</span>
                                    <div class="item-dots"></div>
                                    <span style="color:var(--gold); font-family:'Inter'; font-weight:700;">$${item.price}</span>
                                </div>
                                <div class="item-desc" style="font-family:'Inter'; font-size:0.85rem; color:var(--text-muted); margin-top:5px; line-height:1.5;">${item.desc}</div>
                            </div>`;
                    });

                    catDiv.innerHTML = `
                        <h2 style="font-family:var(--font-heading); color:var(--gold); margin-bottom:20px; text-transform:uppercase; font-size:1.1rem; border-bottom: 1px solid var(--border); padding-bottom:10px; letter-spacing:2px;">
                            ${cat.title}
                        </h2>` + itemsHtml;
                    
                    container.appendChild(catDiv);
                });
            } catch (e) {
                console.error("Could not load menu.json", e);
            }
        }
        window.onload = loadMenu;
    </script>
</body>
</html>
