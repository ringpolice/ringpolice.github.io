<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>State Dining Menu</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Libre+Baskerville&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

:root{

--navy:#16233b;
--gold:#caa74c;
--green:#2f7d36;

--bg:#f4f5f7;
--card:#ffffff;
--text:#1c2430;

--paper:
repeating-linear-gradient(
0deg,
rgba(0,0,0,0.015),
rgba(0,0,0,0.015) 2px,
transparent 2px,
transparent 4px
);

}

body.dark{

--bg:#0f1724;
--card:#182338;
--text:#e8edf5;

--paper:
repeating-linear-gradient(
0deg,
rgba(255,255,255,0.02),
rgba(255,255,255,0.02) 2px,
transparent 2px,
transparent 4px
);

}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

background:var(--bg);
color:var(--text);
font-family:"Libre Baskerville",serif;
padding:40px;
transition:.35s;

}

.container{

max-width:1050px;
margin:auto;

background:
var(--paper),
var(--card);

border:3px solid var(--gold);
border-radius:10px;

padding:70px;

box-shadow:0 20px 45px rgba(0,0,0,.18);

}

.header{
text-align:center;
position:relative;
margin-bottom:60px;
}

.theme-toggle{

position:absolute;
right:0;
top:0;

cursor:pointer;
font-size:18px;
color:var(--navy);

opacity:.8;
transition:.25s;

}

body.dark .theme-toggle{
color:#e8edf5;
}

.theme-toggle:hover{
transform:scale(1.1);
opacity:1;
}

.logo{

width:320px;
max-width:90%;
margin-bottom:25px;

}

.subtitle{

font-size:16px;
opacity:.75;
margin-top:6px;

}

.menu-grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:30px;

}

.menu-card{

background:var(--card);
padding:28px;
border:1px solid rgba(0,0,0,.08);
border-radius:8px;
position:relative;

transition:.3s;

}

.menu-card:before{

content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:3px;
background:var(--gold);

}

.menu-card:hover{

transform:translateY(-5px);
box-shadow:0 12px 25px rgba(0,0,0,.15);

}

.card-title{

font-family:"Playfair Display",serif;
font-size:22px;
margin-bottom:16px;

color:var(--navy);

border-bottom:1px solid rgba(0,0,0,.1);
padding-bottom:6px;

display:flex;
align-items:center;
gap:10px;

}

body.dark .card-title{
color:#e5ecfa;
}

.card-title i{
color:var(--gold);
}

.menu-item{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;

}

.item-name{
font-weight:600;
display:flex;
align-items:center;
gap:8px;
}

.item-name i{
color:var(--green);
font-size:14px;
width:16px;
text-align:center;
}

.footer{

text-align:center;
margin-top:55px;
padding-top:18px;
border-top:1px solid rgba(0,0,0,.1);
font-size:14px;
opacity:.7;

}

</style>
</head>

<body>

<div class="container">

<div class="header">

<div class="theme-toggle" onclick="toggleTheme()">
<i id="themeIcon" class="fa-solid fa-moon"></i>
</div>

<img class="logo"
src="https://cdn.craftingstore.net/rPPmDHlLQ1/1aa628fef9ff6edac3320855caba2c95/aklb0wlnur0rxbtsfq8u.png">

<div class="subtitle">VindexCraft State Dining Service</div>

</div>

<div class="menu-grid">

<!-- STARTERS -->

<div class="menu-card">

<div class="card-title">
<i class="fa-solid fa-seedling"></i>
Starters
</div>

<div class="menu-item">
<span class="item-name"><i class="fa-solid fa-bowl-food"></i>Mac N' Cheese</span>
</div>

<div class="menu-item">
<span class="item-name"><i class="fa-solid fa-utensil-spoon"></i>Soup of the Day</span>
</div>

<div class="menu-item">
<span class="item-name"><i class="fa-solid fa-burger"></i>Sliders</span>
</div>

</div>

<!-- SIDES -->

<div class="menu-card">

<div class="card-title">
<i class="fa-solid fa-plate-wheat"></i>
Sides
</div>

<div class="menu-item">
<span class="item-name"><i class="fa-solid fa-bread-slice"></i>Garlic Bread</span>
</div>

<div class="menu-item">
<span class="item-name"><i class="fa-solid fa-potato"></i>Baked Potato</span>
</div>

<div class="menu-item">
<span class="item-name"><i class="fa-solid fa-french-fries"></i>Steak Fries</span>
</div>

<div class="menu-item">
<span class="item-name"><i class="fa-solid fa-apple-whole"></i>Assorted Fruit</span>
</div>

<div class="menu-item">
<span class="item-name"><i class="fa-solid fa-bowl-rice"></i>Bowl of Rice</span>
</div>

</div>

<!-- ENTREES -->

<div class="menu-card">

<div class="card-title">
<i class="fa-solid fa-utensils"></i>
Entrées
</div>

<div class="menu-item">
<span class="item-name">TBA</span>
</div>

</div>

<!-- DESSERTS -->

<div class="menu-card">

<div class="card-title">
<i class="fa-solid fa-cake-candles"></i>
Desserts
</div>

<div class="menu-item">
<span class="item-name">TBA</span>
</div>

</div>

<!-- DRINKS -->

<div class="menu-card">

<div class="card-title">
<i class="fa-solid fa-glass-water"></i>
Drinks
</div>

<div class="menu-item">
<span class="item-name">TBA</span>
</div>

</div>

</div>

<div class="footer">
State Dining Service • VindexCraft
</div>

</div>

<script>

function toggleTheme(){

document.body.classList.toggle("dark")

const icon=document.getElementById("themeIcon")

if(document.body.classList.contains("dark")){
icon.classList.remove("fa-moon")
icon.classList.add("fa-sun")
}else{
icon.classList.remove("fa-sun")
icon.classList.add("fa-moon")
}

}

</script>

</body>
</html>
