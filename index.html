<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State Dining Menu | VindexCraft</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --navy: #16233b; --gold: #caa74c; --green: #2f7d36;
            --bg: #f4f5f7; --card: #ffffff; --text: #1c2430; --text-muted: #566573;
            --paper: repeating-linear-gradient(0deg, rgba(0,0,0,0.015), rgba(0,0,0,0.015) 2px, transparent 2px, transparent 4px);
        }

        body.dark {
            --bg: #0f1724; --card: #182338; --text: #e8edf5; --text-muted: #aab4be;
            --paper: repeating-linear-gradient(0deg, rgba(255,255,255,0.02), rgba(255,255,255,0.02) 2px, transparent 2px, transparent 4px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Libre Baskerville", serif;
            padding: 20px;
            transition: background 0.35s, color 0.35s;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            background: var(--paper), var(--card);
            border: 3px solid var(--gold);
            border-radius: 12px;
            padding: 5% 8%;
            box-shadow: 0 20px 45px rgba(0,0,0,.18);
        }

        .header { text-align: center; position: relative; margin-bottom: 60px; }

        .theme-toggle {
            position: absolute; right: -10px; top: -10px;
            cursor: pointer; font-size: 20px; color: var(--gold);
            padding: 10px; transition: .25s;
        }

        .logo { width: 280px; max-width: 90%; margin-bottom: 15px; }

        .subtitle {
            font-family: "Playfair Display", serif;
            font-size: 18px; letter-spacing: 2px;
            text-transform: uppercase; opacity: .8;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .menu-card {
            background: var(--card); padding: 30px;
            border: 1px solid rgba(0,0,0,.05); border-radius: 8px;
            position: relative; transition: .3s;
        }

        .menu-card.featured { grid-column: span 2; border: 1px solid var(--gold); }

        .card-title {
            font-family: "Playfair Display", serif;
            font-size: 24px; font-weight: 700; margin-bottom: 20px;
            color: var(--navy); border-bottom: 2px solid var(--gold);
            padding-bottom: 8px; display: flex; align-items: center; gap: 12px;
        }

        body.dark .card-title { color: #ffffff; }

        .menu-item { margin-bottom: 18px; }
        .item-main { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
        .item-name { display: flex; align-items: center; gap: 10px; }
        .item-name i { color: var(--green); font-size: 14px; width: 18px; }
        .item-price { font-family: "Playfair Display", serif; color: var(--gold); }
        .item-desc { font-size: 13px; font-style: italic; color: var(--text-muted); display: block; margin-top: 4px; padding-left: 28px; }

        .footer {
            text-align: center; margin-top: 60px; padding-top: 20px;
            border-top: 1px solid rgba(128, 128, 128, 0.2);
            font-size: 13px; opacity: .7;
        }

        @media (max-width: 768px) {
            .menu-grid { grid-template-columns: 1fr; }
            .menu-card.featured { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="theme-toggle" onclick="toggleTheme()">
            <i id="themeIcon" class="fa-solid fa-moon"></i>
        </div>
        <img class="logo" src="https://cdn.craftingstore.net/rPPmDHlLQ1/1aa628fef9ff6edac3320855caba2c95/aklb0wlnur0rxbtsfq8u.png">
        <div class="subtitle">State Dining Service</div>
    </div>

    <div class="menu-grid" id="menu-container">
        </div>

    <div class="footer">
        STATE DINING SERVICE • VINDEXCRAFT • EST. 2024
    </div>
</div>

<script>
    async function loadMenu() {
        try {
            const response = await fetch('menu.json');
            if (!response.ok) throw new Error('Could not load menu.json');
            const data = await response.json();
            const container = document.getElementById('menu-container');

            data.categories.forEach(cat => {
                const card = document.createElement('div');
                card.className = `menu-card ${cat.featured ? 'featured' : ''}`;

                let itemsHtml = `
                    <div class="card-title">
                        <i class="fa-solid ${cat.icon}"></i> ${cat.title}
                    </div>
                `;

                cat.items.forEach(item => {
                    itemsHtml += `
                        <div class="menu-item">
                            <div class="item-main">
                                <span class="item-name">
                                    ${item.icon ? `<i class="fa-solid ${item.icon}"></i>` : '<i class="fa-solid fa-minus" style="opacity:0.2"></i>'}
                                    ${item.name}
                                </span>
                                <span class="item-price">${item.price}</span>
                            </div>
                            ${item.desc ? `<span class="item-desc">${item.desc}</span>` : ''}
                        </div>
                    `;
                });

                card.innerHTML = itemsHtml;
                container.appendChild(card);
            });
        } catch (err) {
            console.error(err);
            document.getElementById('menu-container').innerHTML = "<p>Error loading menu. Please ensure you are using a local server or web host.</p>";
        }
    }

    function toggleTheme(){
        document.body.classList.toggle("dark");
        const icon = document.getElementById("themeIcon");
        icon.classList.toggle("fa-moon");
        icon.classList.toggle("fa-sun");
    }

    loadMenu();
</script>

</body>
</html>
