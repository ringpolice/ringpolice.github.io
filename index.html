<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VindexCraft | Gourmet Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
    <div class="container">
        <header style="text-align: center; margin-bottom: 30px;">
            <img src="logo.png" alt="VindexCraft" style="height: 60px;">
        </header>

        <div id="public-menu" class="menu-grid">
            </div>
    </div>

    <script>
        async function loadMenu() {
            try {
                const res = await fetch('menu.json?v=' + Date.now());
                const data = await res.json();
                const container = document.getElementById('public-menu');
                
                data.categories.forEach(cat => {
                    const catDiv = document.createElement('div');
                    catDiv.className = 'menu-category';
                    let itemsHtml = '';
                    
                    cat.items.forEach(item => {
                        itemsHtml += `
                            <div class="menu-item">
                                <div class="item-main">
                                    <span>${item.name}</span>
                                    <div class="item-dots"></div>
                                    <span style="color:var(--gold)">$${item.price}</span>
                                </div>
                                <div class="item-desc">${item.desc}</div>
                            </div>`;
                    });

                    catDiv.innerHTML = `<h2>${cat.title}</h2>` + itemsHtml;
                    container.appendChild(catDiv);
                });
            } catch (e) { console.error("Error loading menu", e); }
        }
        window.onload = loadMenu;
    </script>
</body>
</html>
