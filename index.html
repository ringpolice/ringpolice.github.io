<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VindexCraft | State Dining Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Baskerville&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">

<div id="loginModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center; backdrop-filter:blur(5px);">
    <div style="background:var(--card); border:2px solid var(--gold); padding:30px; border-radius:12px; width:320px; text-align:center;">
        <h3 style="font-family:'Playfair Display'; color:var(--gold); margin-bottom:20px;">Chef Authentication</h3>
        <input type="password" id="adminPass" placeholder="Secret Key" style="width:100%; padding:12px; margin-bottom:15px; background:rgba(255,255,255,0.05); border:1px solid var(--gold); color:white; outline:none; border-radius:4px;">
        <button class="btn btn-main" onclick="checkAuth()">Login</button>
        <p id="error" style="color:#ff4d4d; font-size:12px; margin-top:10px; display:none;">Invalid Key</p>
        <button onclick="closeLogin()" style="background:none; border:none; color:var(--text-muted); margin-top:15px; cursor:pointer;">Cancel</button>
    </div>
</div>

<div class="container">
    <div class="header">
        <div class="controls">
            <div class="control-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></div>
            <div class="control-btn" onclick="openLogin()"><i class="fa-solid fa-user-shield"></i></div>
        </div>
        <img class="logo" src="https://cdn.craftingstore.net/rPPmDHlLQ1/1aa628fef9ff6edac3320855caba2c95/aklb0wlnur0rxbtsfq8u.png">
        <div class="subtitle">Official State Dining Menu</div>
    </div>
    <div id="menu-grid"></div>
    <div style="text-align:center; margin-top:20px; font-size:10px; opacity:0.5;">VINDEXCRAFT OFFICIAL SERVICE • EST. 2024</div>
</div>

<script>
    function openLogin() { document.getElementById('loginModal').style.display = 'flex'; document.getElementById('adminPass').focus(); }
    function closeLogin() { document.getElementById('loginModal').style.display = 'none'; }
    function checkAuth() {
        if (document.getElementById('adminPass').value === 'CHEF2024') {
            sessionStorage.setItem('authenticated', 'true');
            window.location.href = 'admin.html';
        } else { document.getElementById('error').style.display = 'block'; }
    }

    async function loadMenu() {
        const response = await fetch(`./menu.json?v=${Date.now()}`);
        const data = await response.json();
        const grid = document.getElementById('menu-grid');
        grid.innerHTML = data.categories.map(cat => `
            <div class="menu-card">
                <h3 class="card-title"><i class="fa-solid ${cat.icon || 'fa-utensils'}"></i> ${cat.title}</h3>
                ${cat.items.map(item => `
                    <div class="menu-item">
                        <div class="item-header">
                            <span class="item-name">${item.name}</span>
                            <span class="item-dots"></span>
                            <span class="item-price">$${item.price}</span>
                        </div>
                        <div class="item-desc">${item.desc}</div>
                    </div>`).join('')}
            </div>`).join('');
    }
    function toggleTheme() { document.body.classList.toggle('dark'); }
    loadMenu();
</script>
</body>
</html>
