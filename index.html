<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VindexCraft | State Dining Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Baskerville&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
<div class="container">
    <div class="header">
        <div class="controls">
            <div class="control-btn" onclick="toggleTheme()"><i id="themeIcon" class="fa-solid fa-moon"></i></div>
            <div class="control-btn" onclick="window.location.href='admin.html'"><i class="fa-solid fa-user-shield"></i></div>
        </div>
        <img class="logo" src="https://cdn.craftingstore.net/rPPmDHlLQ1/1aa628fef9ff6edac3320855caba2c95/aklb0wlnur0rxbtsfq8u.png">
        <div class="subtitle">Official State Dining Menu</div>
    </div>
    <div id="menu-grid"></div>
    <div style="text-align:center; margin-top:20px; font-size:10px; opacity:0.5;">VINDEXCRAFT OFFICIAL SERVICE • EST. 2024</div>
</div>
<script>
    async function loadMenu() {
        try {
            const response = await fetch(`./menu.json?v=${Date.now()}`);
            const data = await response.json();
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            data.categories.forEach(cat => {
                const card = document.createElement('div');
                card.className = 'menu-card';
                let itemsHtml = cat.items.map(item => `
                    <div class="menu-item">
                        <div class="item-header">
                            <span class="item-name">${item.name}</span>
                            <span class="item-dots"></span>
                            <span class="item-price">$${item.price}</span>
                        </div>
                        <div class="item-desc">${item.desc}</div>
                    </div>`).join('');
                card.innerHTML = `<h3 class="card-title"><i class="fa-solid ${cat.icon || 'fa-utensils'}"></i> ${cat.title}</h3>${itemsHtml}`;
                grid.appendChild(card);
            });
        } catch (e) { console.error(e); }
    }
    function toggleTheme() { document.body.classList.toggle('dark'); }
    loadMenu();
</script>
</body>
</html>
